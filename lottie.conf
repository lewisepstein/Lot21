# HTTP → HTTPS redirect
server {
    listen 80;
    server_name lottie.lot21.org;
    client_max_body_size 100M;
    return 301 https://lottie.lot21.org$request_uri;
}

# HTTPS block
server {
    listen 443 ssl;
    server_name lottie.lot21.org;
    client_max_body_size 100M;

    ssl_certificate /etc/letsencrypt/live/lottie.lot21.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lottie.lot21.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /static/ {
        alias /home/ec2-user/webapp/lot21/app/static/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

